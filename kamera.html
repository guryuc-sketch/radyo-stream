<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO Başlığı -->
    <title>VOM Canlı Kamera | Sanat Stüdyosu ve Görüntülü Sohbet</title>
    <meta name="description" content="VOM-VOMITORIUM canlı yayın. Atölye çalışmaları, sanatçı buluşmaları ve yaratıcı süreçleri anlık izleyin.">
    <link rel="canonical" href="https://vom-blog.com/kamera.html">

    <!-- FAVICONLAR -->
    <link rel="icon" type="image/png" sizes="16x16" href="https://vom-blog.com/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://vom-blog.com/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://vom-blog.com/apple-touch-icon.png">
    <link rel="shortcut icon" href="https://vom-blog.com/favicon.ico">

    <script src="https://meet.jit.si/external_api.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: #000; overflow: hidden; }
        #jitsi-container { height: 100vh; width: 100vw; z-index: 1; }

        /* SEO Başlığını Gizleme */
        .seo-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* LOGO PANELİ - Jitsi Yazısını Kapatacak Şekilde Düzeltildi */
        .custom-logo-panel {
            position: fixed;
            top: 0;   /* Köşeye sıfırla */
            left: 0;  /* Köşeye sıfırla */
            z-index: 99999 !important;
            pointer-events: none;
            
            /* Arka plan daha koyu yapıldı ki arkadaki Jitsi logosu görünmesin */
            background: rgba(0, 0, 0, 0.7); 
            padding: 15px 25px;
            border-bottom-right-radius: 25px; /* Şık kavis */
            
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }

        /* Logo boyutu büyütüldü */
        .custom-logo-panel img { 
            width: 150px; 
            height: auto; 
            display: block; 
        }
        
        /* Mobil Cihazlar İçin Logo Boyutu */
        @media (max-width: 480px) {
            .custom-logo-panel { padding: 10px 15px; }
            .custom-logo-panel img { width: 110px; }
        }
    </style>
</head>
<body>

    <header class="seo-only">
        <h1>VOM - VOMITARIUM GÖRÜNTÜLÜ SOHBET VE CANLI KAMERA</h1>
    </header>

    <!-- Logonuz Artık Daha Büyük ve Köşeyi Tam Kapatıyor -->
    <div class="custom-logo-panel">
        <img src="https://vom-blog.com/apple-touch-icon.png" alt="VOM Logo">
    </div>

    <div id="jitsi-container"></div>

    <script>
        const domain = 'meet.jit.si';
        const options = {
            roomName: 'VOM_Kulturel_Sohbet_Zq99xVom_2024', 
            width: '100%',
            height: '100%',
            parentNode: document.querySelector('#jitsi-container'),
            configOverwrite: {
                resolution: 720,
                constraints: {
                    video: {
                        height: { ideal: 720, max: 720, min: 480 },
                        width: { ideal: 1280, max: 1280, min: 640 }
                    }
                },
                videoQuality: { preferredCodec: 'H264' },
                enableLobby: true,              
                disableDeepLinking: true,       
                requireDisplayName: true,       
                startWithVideoMuted: true,
                startWithAudioMuted: false,
                defaultLanguage: 'tr',
                prejoinPageEnabled: true
            },
            interfaceConfigOverwrite: {
                APP_NAME: 'VOM Görüntülü Sohbet',
                SHOW_JITSI_WATERMARK: false,
                SHOW_BRAND_WATERMARK: false,
                HIDE_DEEP_LINKING_LOGO: true,
                TOOLBAR_BUTTONS: [
                    'microphone', 'camera', 'hangup', 'chat', 'raisehand', 
                    'tileview', 'fullscreen', 'videobackgroundblur', 'security'
                ]
            }
        };

        const api = new JitsiMeetExternalAPI(domain, options);

        // Moderatör girişi yapıldığında lobi (onay) sistemini çalıştırır
        api.on('participantRoleChanged', function(event) {
            if (event.role === 'moderator') {
                api.executeCommand('lobby', { enable: true });
                api.executeCommand('toggleLobby', true);
            }
        });

        // Sohbetten çıkınca ana sayfaya dön
        api.on('videoConferenceLeft', () => {
            window.location.href = "https://vom-blog.com";
        });
    </script>
</body>
</html>
