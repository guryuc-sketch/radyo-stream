<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOM Canlı Yayın Stüdyosu</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="https://vom-blog.com/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://vom-blog.com/apple-touch-icon.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            height: 100%; width: 100%; 
            background: #000 url('https://vom-blog.com/apple-touch-icon.png') no-repeat center 20%;
            background-size: 150px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, system-ui, sans-serif; color: white;
        }

        /* KARŞILAMA PANELİ */
        .welcome-panel {
            text-align: center; background: rgba(255,255,255,0.05);
            padding: 40px 30px; border-radius: 30px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            width: 90%; max-width: 400px; margin-top: 100px;
        }

        h1 { font-size: 20px; margin-bottom: 10px; letter-spacing: 1px; }
        p { font-size: 14px; color: #888; margin-bottom: 30px; line-height: 1.5; }

        /* WHATSAPP TARZI BAĞLAN BUTONU */
        .connect-btn {
            display: block; width: 100%; background: #ff0000;
            color: #fff; padding: 18px; border-radius: 50px;
            text-decoration: none; font-weight: bold; font-size: 16px;
            box-shadow: 0 10px 30px rgba(255,0,0,0.3);
            transition: transform 0.2s;
        }
        .connect-btn:active { transform: scale(0.95); }

        .live-tag {
            position: fixed; top: 30px; display: flex; align-items: center; gap: 8px;
            color: #ff0000; font-weight: bold; font-size: 12px; letter-spacing: 2px;
        }
        .dot { width: 8px; height: 8px; background: #ff0000; border-radius: 50%; animation: blink 1.2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="live-tag">
        <span class="dot"></span> CANLI YAYIN ÜNİTESİ
    </div>

    <div class="welcome-panel">
        <h1>VOM CANLI STÜDYO</h1>
        <p>Görüntülü sohbete katılmak için aşağıdaki butona dokunun. <br>Safari kamera izni istediğinde <b>"İzin Ver"</b> deyin.</p>
        
        <!-- BU BUTON IPHONE KISITLAMASINI KIRAR -->
        <a href="https://sfu.mirotalk.com/join?room=VOM_Kultur_Sanat_Sohbeti_2026_Vomitorium" class="connect-btn">YAYINA BAĞLAN</a>
    </div>

    <p style="margin-top: 20px; font-size: 10px; color: #444;">&copy; 2026 VOM-VOMITORIUM</p>

</body>
</html>
