<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
    <title>VOM | Radyo Player - Canlı Sohbet</title>
    <meta name="description" content="VOM Radyo - kesintisiz müzik ve kültür sanat yayını.">
    <meta name="keywords" content="radyo player, radyo, web radio, vomradyo, sohbet, chat, vom radyo">
    <meta name="author" content="VOM YAYIN">
    
    <!-- Preconnect ve Preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://vom-yayin-default-rtdb.europe-west1.firebasedatabase.app">
    
    <!-- Fontlar ertelendi (render-blocking yok) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
    
    <!-- Fontawesome ertelendi -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"></noscript>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #d9dce5 0%, #c2c6d1 100%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .radio-container {
            max-width: 580px;
            width: 100%;
            background: radial-gradient(circle at 20% 30%, #e8eaef, #b9bfcc);
            border-radius: 3rem;
            box-shadow: 20px 20px 35px rgba(0, 0, 0, 0.3), -8px -8px 18px rgba(255, 255, 255, 0.6), inset 2px 2px 4px rgba(255,255,255,0.5), inset -3px -3px 6px rgba(0,0,0,0.1);
            padding: 1.8rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.7);
        }
        .radio-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }
        .station-name {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #2d2f36, #1e2027);
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .station-name i { color: #3a3f4b; font-size: 1.7rem; }
        .live-badge {
            background: #e33b3b;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.9rem;
            border-radius: 60px;
            text-transform: uppercase;
            box-shadow: inset 0 -1px 0 rgba(0,0,0,0.1), 0 2px 6px rgba(0,0,0,0.1);
        }
        .live-badge.offline { background: #6c757d; color: #e9ecef; }
        @keyframes pulseLive {
            0% { opacity: 0.8; box-shadow: 0 0 0 0 rgba(227, 59, 59, 0.4);}
            70% { opacity: 1; box-shadow: 0 0 0 6px rgba(227,59,59,0);}
            100% { opacity: 0.8;}
        }
        .live-badge:not(.offline) { animation: pulseLive 1.2s infinite; }
        
        .song-info-panel {
            background: #0a0c12;
            border-radius: 2rem;
            padding: 1rem 1.2rem;
            margin: 1rem 0 1.3rem;
            box-shadow: inset 0 0 0 1px rgba(80, 220, 255, 0.2), 0 10px 20px rgba(0, 0, 0, 0.4);
        }
        .current-track { display: flex; flex-direction: column; gap: 0.75rem; }
        .visualizer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .equalizer {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 40px;
            background: rgba(0, 0, 0, 0.6);
            padding: 0 12px;
            border-radius: 30px;
            flex: 1;
        }
        .eq-bar {
            width: 4px;
            height: 12px;
            background: #0f0;
            border-radius: 2px;
            transition: height 0.08s ease;
            box-shadow: 0 0 4px #0f0;
        }
        .listener-count, .time-digital {
            background: #000000aa;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            color: #0aff9e;
            font-weight: 600;
            font-size: 0.85rem;
            backdrop-filter: blur(4px);
            border: 1px solid #2affaa30;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .track-marquee {
            background: #03060b;
            border-radius: 48px;
            padding: 0.35rem 1rem;
            overflow: hidden;
            border: 1px solid #2cffb0;
        }
        .marquee-content {
            display: flex;
            white-space: nowrap;
            animation: scrollText 14s linear infinite;
            gap: 2rem;
        }
        .marquee-content span { font-weight: 600; font-size: 0.9rem; color: #befff0; }
        .marquee-content i { color: #3eff9e; margin-right: 8px; }
        @keyframes scrollText {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .track-artist-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #9effd0;
            background: #00000055;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.8rem;
            margin: 1.5rem 0 1rem;
        }
        .ctrl-btn {
            background: radial-gradient(circle at 30% 20%, #eff2f9, #c4cad9);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #2c2f3a;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 8px 8px 14px rgba(0, 0, 0, 0.25), -6px -6px 12px rgba(255, 255, 255, 0.7);
            border: none;
        }
        .ctrl-btn:active { transform: scale(0.96); }
        .play-pause { width: 85px; height: 85px; font-size: 2.5rem; }
        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
            background: rgba(0,0,0,0.1);
            padding: 0.5rem 1rem;
            border-radius: 60px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        input[type="range"] {
            width: 140px;
            height: 4px;
            -webkit-appearance: none;
            background: #3a3f4e;
            border-radius: 10px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #eef2ff;
            border-radius: 50%;
            cursor: pointer;
        }
        .chat-button {
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 2rem;
            padding: 0.9rem 1.2rem;
            margin: 1.2rem 0 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .chat-button:hover { transform: translateY(-3px); }
        .chat-button a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
        }
        .chat-button.offline {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            cursor: not-allowed;
            opacity: 0.7;
        }
        .chat-button.offline:hover { transform: none; }
        .credit {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 1.5rem;
            color: #2e3b4e;
        }
        
        /* Chat Popup */
        .chat-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            max-width: 90vw;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            z-index: 10001;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            flex-direction: column;
            max-height: 85vh;
        }
        .chat-popup.active { display: flex; animation: fadeInUp 0.3s ease; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        .chat-header {
            background: #075E54;
            color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-title { display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .chat-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }
        .chat-close:hover { background: rgba(255,255,255,0.2); }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background: #ECE5DD;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 300px;
            max-height: 50vh;
        }
        .chat-message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 18px;
            font-size: 0.85rem;
            word-break: break-word;
        }
        .chat-message.received { background: white; align-self: flex-start; border-top-left-radius: 4px; }
        .chat-message.sent { background: #DCF8C6; align-self: flex-end; border-top-right-radius: 4px; }
        .chat-message-username { font-weight: 700; font-size: 0.7rem; color: #075E54; }
        .chat-message-time { font-size: 0.6rem; color: #999; margin-top: 0.2rem; text-align: right; }
        .chat-system { text-align: center; font-size: 0.7rem; color: #666; margin: 0.3rem 0; }
        .chat-input-area {
            display: flex;
            flex-direction: column;
            padding: 12px;
            background: #f0f0f0;
            gap: 10px;
            border-top: 1px solid #ddd;
        }
        .chat-input-area input, .chat-input-area textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 0.9rem;
            outline: none;
        }
        .chat-input-area textarea { resize: none; font-family: inherit; }
        .chat-input-area button {
            background: #075E54;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }
        .chat-status {
            text-align: center;
            font-size: 0.65rem;
            padding: 8px;
            background: #f0f0f0;
            color: #666;
            border-top: 1px solid #e0e0e0;
        }
        .chat-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
        }
        .chat-overlay.active { display: block; }
        
        @media (max-width: 550px) {
            .radio-container { padding: 1.2rem; }
            .ctrl-btn { width: 55px; height: 55px; font-size: 1.5rem; }
            .play-pause { width: 70px; height: 70px; font-size: 2rem; }
            .station-name { font-size: 1.4rem; }
            .equalizer { height: 32px; }
            .eq-bar { width: 3px; }
            .listener-count, .time-digital { padding: 0.2rem 0.6rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="radio-container" id="radioContainer">
    <div class="radio-header">
        <div class="station-name"><i class="fas fa-broadcast-tower"></i> <span>VOM RADYO</span></div>
        <div class="live-badge" id="liveBadge">CANLI</div>
    </div>
    <div class="song-info-panel">
        <div class="current-track">
            <div class="visualizer-row">
                <div class="equalizer" id="eqVisualizer" aria-label="Ses görselleştirici">
                    <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                    <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                    <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                    <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                </div>
                <div class="listener-count" id="listenerCount" aria-label="Dinleyici sayısı">
                    <i class="fas fa-headphones"></i> <span id="listenerNumber">0</span>
                </div>
                <div class="time-digital" id="liveDigitalClock" aria-label="Saat">00:00:00</div>
            </div>
            <div class="track-marquee">
                <div class="marquee-content" id="marqueeTrack">
                    <span><i class="fas fa-music"></i> VOM Canlı Yayın</span>
                    <span><i class="fas fa-music"></i> VOM Canlı Yayın</span>
                </div>
            </div>
            <div class="track-artist-line" id="artistSubline">
                <span><i class="fas fa-headphones"></i> <span id="subArtistText">Pop · Rock · Kültür Sanat</span></span>
                <span><i class="fas fa-waveform"></i> Dijital Stereo</span>
            </div>
        </div>
    </div>
    <div class="controls">
        <button class="ctrl-btn" id="playBtn" aria-label="Oynat"><i class="fas fa-play"></i></button>
        <button class="ctrl-btn play-pause" id="mainPlayPause" aria-label="Oynat/Durdur"><i class="fas fa-play" id="playPauseIcon"></i></button>
        <button class="ctrl-btn" id="stopBtn" aria-label="Durdur"><i class="fas fa-stop"></i></button>
    </div>
    <div class="volume-control">
        <i class="fas fa-volume-down"></i>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7" aria-label="Ses seviyesi">
        <i class="fas fa-volume-up"></i>
    </div>
    <div class="chat-button" id="chatButtonSide">
        <a href="#" id="chatLinkSide"><i class="fab fa-whatsapp"></i> Canlı Sohbet</a>
    </div>
    <div class="credit">
        <i class="fas fa-headphones"></i> 7/24 canlı yayın · <span id="streamStatusText">Başlatmak için oynat</span>
    </div>
</div>

<div class="chat-overlay" id="chatOverlay"></div>
<div class="chat-popup" id="chatPopup">
    <div class="chat-header">
        <div class="chat-title"><i class="fab fa-whatsapp"></i> VOM Canlı Sohbet</div>
        <button class="chat-close" id="chatCloseBtn" aria-label="Kapat">&times;</button>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="chat-system">💬 Yayın devam ederken sohbet aktif olur.</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="chatUsername" placeholder="👤 Kullanıcı adınız" aria-label="Kullanıcı adı">
        <textarea id="chatInput" placeholder="💬 Mesajınızı yazın (Enter gönder)" rows="1" aria-label="Mesaj"></textarea>
        <button id="chatSendBtn" aria-label="Gönder"><i class="fas fa-paper-plane"></i> Gönder</button>
    </div>
    <div class="chat-status" id="chatStatus">Sohbet sadece canlı yayında açıktır.</div>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getDatabase, ref, push, onChildAdded, remove } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

    const firebaseConfig = {
        apiKey: "AIzaSyCp-NfSJmRSTAAWrNla5tH2OY9wMr87mFA",
        authDomain: "vom-yayin.firebaseapp.com",
        projectId: "vom-yayin",
        storageBucket: "vom-yayin.firebasestorage.app",
        messagingSenderId: "93785669208",
        appId: "1:93785669208:web:ecccf7c03aa3ad6117d42d",
        databaseURL: "https://vom-yayin-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);
    const messagesRef = ref(rtdb, 'messages');

    const STREAM_URL = "https://radyo.vomyayin.dpdns.org/vomyayin";
    const STATUS_URL = "https://radyo.vomyayin.dpdns.org/status-json.xsl";
    
    const audio = new Audio();
    audio.preload = "metadata";
    audio.src = STREAM_URL;
    
    const playBtn = document.getElementById('playBtn');
    const mainPlayPause = document.getElementById('mainPlayPause');
    const stopBtn = document.getElementById('stopBtn');
    const playPauseIcon = document.getElementById('playPauseIcon');
    const liveBadge = document.getElementById('liveBadge');
    const volumeSlider = document.getElementById('volumeSlider');
    const streamStatusSpan = document.getElementById('streamStatusText');
    const marqueeSpan = document.getElementById('marqueeTrack');
    const subArtistSpan = document.getElementById('subArtistText');
    const liveDigitalClock = document.getElementById('liveDigitalClock');
    const listenerNumberSpan = document.getElementById('listenerNumber');
    
    let isPlaying = false;
    let isLiveActive = true;
    let metadataInterval = null;
    let listenerInterval = null;
    let eqAnimationId = null;
    let eqBars = [];
    let reconnectAttempt = 0;
    let reconnectTimeout = null;

    async function fetchListenerCount() {
        try {
            const response = await fetch(STATUS_URL);
            const data = await response.json();
            let listeners = 0;
            if (data.icestats?.source) {
                const sources = data.icestats.source;
                if (Array.isArray(sources)) {
                    listeners = sources.reduce((total, src) => total + (parseInt(src.listeners) || 0), 0);
                } else {
                    listeners = parseInt(sources.listeners) || 0;
                }
            }
            if (listenerNumberSpan) listenerNumberSpan.innerText = listeners;
        } catch(e) {}
    }
    
    function startListenerUpdater() {
        if (listenerInterval) clearInterval(listenerInterval);
        listenerInterval = setInterval(() => { if (isPlaying && isLiveActive) fetchListenerCount(); }, 15000);
        fetchListenerCount();
    }
    
    function initEqualizer() {
        const barsContainer = document.getElementById('eqVisualizer');
        if(barsContainer) eqBars = Array.from(barsContainer.querySelectorAll('.eq-bar'));
        function animateEQ() {
            if(!isPlaying || !isLiveActive) {
                if(eqBars.length) eqBars.forEach(bar => bar.style.height = '6px');
                if(eqAnimationId) cancelAnimationFrame(eqAnimationId);
                eqAnimationId = null;
                return;
            }
            if(eqBars.length) {
                eqBars.forEach(bar => {
                    bar.style.height = `${6 + Math.floor(Math.random() * 28)}px`;
                });
            }
            eqAnimationId = requestAnimationFrame(animateEQ);
        }
        animateEQ();
    }
    
    function updateDigitalClock() {
        const now = new Date();
        liveDigitalClock.innerText = now.toLocaleTimeString('tr-TR');
    }
    setInterval(updateDigitalClock, 200);
    updateDigitalClock();
    
    async function fetchMetadata() {
        try {
            const response = await fetch(STATUS_URL);
            const data = await response.json();
            let currentTitle = null, currentArtist = null;
            
            if (data.icestats?.source?.playlist?.trackList) {
                const trackList = data.icestats.source.playlist.trackList;
                if (Array.isArray(trackList) && trackList.length > 0) {
                    const lastTrack = trackList[trackList.length - 1];
                    if (lastTrack?.title) {
                        const parts = lastTrack.title.split(" - ");
                        if (parts.length >= 2) {
                            currentArtist = parts[0];
                            currentTitle = parts.slice(1).join(" - ");
                        } else {
                            currentTitle = lastTrack.title;
                        }
                    }
                }
            }
            if (!currentTitle && data.icestats?.source?.title && data.icestats.source.title !== "null") {
                const parts = data.icestats.source.title.split(" - ");
                if (parts.length >= 2) {
                    currentArtist = parts[0];
                    currentTitle = parts.slice(1).join(" - ");
                } else {
                    currentTitle = data.icestats.source.title;
                }
            }
            
            if (currentTitle) {
                const displayText = currentArtist ? `${currentArtist} - ${currentTitle}` : currentTitle;
                const cleanText = displayText.substring(0, 60);
                const escapeHtml = (str) => str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
                marqueeSpan.innerHTML = `<span><i class="fas fa-music"></i> ${escapeHtml(cleanText)}</span><span><i class="fas fa-music"></i> ${escapeHtml(cleanText)}</span>`;
                if(subArtistSpan) subArtistSpan.innerText = currentArtist || "VOM RADYO";
            }
        } catch(e) {}
    }
    
    function startMetadataUpdater() {
        if (metadataInterval) clearInterval(metadataInterval);
        metadataInterval = setInterval(() => { if (isPlaying && isLiveActive) fetchMetadata(); }, 10000);
        fetchMetadata();
    }
    
    function setLiveStatus(live) {
        isLiveActive = live;
        if (live) {
            liveBadge.innerText = "CANLI";
            liveBadge.classList.remove("offline");
            streamStatusSpan.innerText = "🔴 Canlı yayın";
            document.getElementById('chatButtonSide')?.classList.remove("offline");
            if (isPlaying) {
                startMetadataUpdater();
                startListenerUpdater();
            }
            const statusDiv = document.getElementById('chatStatus');
            if (statusDiv) statusDiv.innerText = "💬 Sohbet aktif, yayın devam ediyor!";
            if(!eqAnimationId) initEqualizer();
            reconnectAttempt = 0;
        } else {
            remove(messagesRef).catch(() => {});
            liveBadge.innerText = "YAYIN YOK";
            liveBadge.classList.add("offline");
            streamStatusSpan.innerText = "⛔ Yayın kapalı";
            document.getElementById('chatButtonSide')?.classList.add("offline");
            if (listenerInterval) clearInterval(listenerInterval);
            if (listenerNumberSpan) listenerNumberSpan.innerText = "0";
            const chatMessagesDiv = document.getElementById('chatMessages');
            if(chatMessagesDiv) chatMessagesDiv.innerHTML = '<div class="chat-system">💬 Yayın devam ederken sohbet aktif olur.</div>';
            const popup = document.getElementById('chatPopup');
            const overlay = document.getElementById('chatOverlay');
            if (popup) popup.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
            document.body.style.overflow = '';
            if (eqAnimationId) cancelAnimationFrame(eqAnimationId);
            eqAnimationId = null;
            if(eqBars.length) eqBars.forEach(bar => bar.style.height = '6px');
        }
    }
    
    function attemptReconnect() {
        if (!isPlaying) return;
        if (reconnectTimeout) clearTimeout(reconnectTimeout);
        reconnectAttempt++;
        if (reconnectAttempt > 3) { setLiveStatus(false); reconnectAttempt = 0; return; }
        streamStatusSpan.innerText = `🔄 Yeniden bağlanıyor (${reconnectAttempt}/3)...`;
        setTimeout(() => { if (isPlaying) { audio.load(); audio.play().catch(() => {}); } }, 2000);
    }
    
    function initAudioEvents() {
        audio.addEventListener('error', () => { if (isPlaying && isLiveActive) attemptReconnect(); });
        audio.addEventListener('stalled', () => { if (isPlaying && isLiveActive && audio.readyState < 2) attemptReconnect(); });
        audio.addEventListener('canplay', () => { if (!isLiveActive) setLiveStatus(true); audio.volume = parseFloat(volumeSlider.value); });
        audio.addEventListener('playing', () => { if (!isLiveActive) setLiveStatus(true); startMetadataUpdater(); startListenerUpdater(); if(!eqAnimationId) initEqualizer(); reconnectAttempt = 0; });
        audio.addEventListener('pause', () => { if (metadataInterval) clearInterval(metadataInterval); if (listenerInterval) clearInterval(listenerInterval); if(eqAnimationId) cancelAnimationFrame(eqAnimationId); eqAnimationId = null; if(eqBars.length) eqBars.forEach(bar => bar.style.height = '6px'); });
    }
    
    function playRadio() {
        if (!isLiveActive) setLiveStatus(true);
        audio.play().then(() => {
            isPlaying = true;
            playPauseIcon.className = "fas fa-pause";
            initEqualizer();
            startListenerUpdater();
        }).catch(() => { setLiveStatus(false); alert("Yayın bağlantısı kurulamadı."); });
    }
    
    function pauseRadio() {
        audio.pause();
        isPlaying = false;
        playPauseIcon.className = "fas fa-play";
        streamStatusSpan.innerText = "⏸ Durduruldu";
        if (metadataInterval) clearInterval(metadataInterval);
        if (listenerInterval) clearInterval(listenerInterval);
        if(eqAnimationId) cancelAnimationFrame(eqAnimationId);
        eqAnimationId = null;
        if(eqBars.length) eqBars.forEach(bar => bar.style.height = '6px');
        if (listenerNumberSpan) listenerNumberSpan.innerText = "0";
    }
    
    function stopRadio() {
        audio.pause();
        audio.currentTime = 0;
        isPlaying = false;
        playPauseIcon.className = "fas fa-play";
        streamStatusSpan.innerText = "⏹ Durduruldu";
        if (metadataInterval) clearInterval(metadataInterval);
        if (listenerInterval) clearInterval(listenerInterval);
        if(eqAnimationId) cancelAnimationFrame(eqAnimationId);
        eqAnimationId = null;
        if(eqBars.length) eqBars.forEach(bar => bar.style.height = '6px');
        if (listenerNumberSpan) listenerNumberSpan.innerText = "0";
    }
    
    const togglePlay = () => { isPlaying ? pauseRadio() : playRadio(); };
    playBtn.onclick = togglePlay;
    mainPlayPause.onclick = togglePlay;
    stopBtn.onclick = () => { if (isPlaying) stopRadio(); else { audio.pause(); audio.currentTime = 0; streamStatusSpan.innerText = "⏹ Durduruldu"; if(eqAnimationId) cancelAnimationFrame(eqAnimationId); if(eqBars.length) eqBars.forEach(b => b.style.height='6px'); if(listenerNumberSpan) listenerNumberSpan.innerText = "0";} };
    volumeSlider.addEventListener('input', (e) => { audio.volume = parseFloat(e.target.value); });
    
    initAudioEvents();
    audio.volume = volumeSlider.value;
    setLiveStatus(true);
    initEqualizer();
    
    // CHAT
    const chatPopup = document.getElementById('chatPopup');
    const chatOverlay = document.getElementById('chatOverlay');
    const chatCloseBtn = document.getElementById('chatCloseBtn');
    const chatButtonSide = document.getElementById('chatButtonSide');
    const chatUsername = document.getElementById('chatUsername');
    const chatInput = document.getElementById('chatInput');
    const chatSendBtn = document.getElementById('chatSendBtn');
    const chatMessagesDiv = document.getElementById('chatMessages');
    
    const escapeHtml = (str) => { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); };
    
    chatButtonSide?.addEventListener('click', (e) => {
        e.preventDefault();
        if (isLiveActive) {
            chatPopup.classList.add('active');
            chatOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        } else { alert("Sohbet sadece canlı yayında açıktır."); }
    });
    chatCloseBtn?.addEventListener('click', () => {
        chatPopup.classList.remove('active');
        chatOverlay.classList.remove('active');
        document.body.style.overflow = '';
    });
    chatOverlay?.addEventListener('click', () => {
        chatPopup.classList.remove('active');
        chatOverlay.classList.remove('active');
        document.body.style.overflow = '';
    });
    
    function sendChatMessage() {
        if (!isLiveActive) { alert("Sohbet sadece canlı yayında açıktır."); return; }
        const username = chatUsername?.value.trim();
        const message = chatInput?.value.trim();
        if (!message) return;
        const finalUsername = (username && username !== '') ? username.substring(0, 20) : 'Anonim';
        push(messagesRef, { username: finalUsername, message: message.substring(0, 500), timestamp: Date.now() }).then(() => { if(chatInput) chatInput.value = ''; }).catch(() => {});
    }
    
    window.deleteChatMessage = function(messageId) {
        const pwd = prompt("Admin şifresi:");
        if (pwd === "vomadmin2026") { remove(ref(rtdb, `messages/${messageId}`)).catch(() => alert("Silinemedi")); } 
        else if (pwd !== null) alert("Şifre yanlış!");
    };
    
    onChildAdded(messagesRef, (snapshot) => {
        if (!isLiveActive || !chatMessagesDiv) return;
        const data = snapshot.val();
        if (!data?.message) return;
        const currentUser = chatUsername?.value.trim() || '';
        const isSelf = (data.username === currentUser);
        const timeStr = data.timestamp ? new Date(data.timestamp).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '';
        const div = document.createElement('div');
        div.className = isSelf ? 'chat-message sent' : 'chat-message received';
        if (isSelf) {
            div.innerHTML = `${escapeHtml(data.message)}<div class="chat-message-time">${timeStr}</div>`;
        } else {
            div.innerHTML = `<div class="chat-message-username">${escapeHtml(data.username)}</div>${escapeHtml(data.message)}<div class="chat-message-time">${timeStr}</div>`;
        }
        const isAdmin = currentUser === 'admin';
        if (isAdmin) {
            div.innerHTML += `<button onclick="window.deleteChatMessage('${snapshot.key}')" style="margin-left:8px; background:#e33b3b; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; color:white; font-size:10px;" aria-label="Sil">🗑</button>`;
        }
        chatMessagesDiv.appendChild(div);
        chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
        while (chatMessagesDiv.children.length > 100) chatMessagesDiv.removeChild(chatMessagesDiv.firstChild);
    });
    
    chatSendBtn?.addEventListener('click', sendChatMessage);
    chatInput?.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); } });
    const savedUsername = localStorage.getItem('vom_chat_username');
    if (savedUsername && chatUsername) chatUsername.value = savedUsername;
    chatUsername?.addEventListener('change', () => { if(chatUsername.value.trim()) localStorage.setItem('vom_chat_username', chatUsername.value.trim()); });
    setInterval(() => { if (!isLiveActive && chatPopup.classList.contains('active')) { chatPopup.classList.remove('active'); chatOverlay.classList.remove('active'); document.body.style.overflow = ''; } }, 1000);
</script>
</body>
</html>
