                    return;
                }

                if (!firebase.apps.length) {

            const aktifAlan = document.getElementById('aktifAlan');

            if (aktif) {
                badge.className = 'durum-badge acik';
                badge.innerHTML = '<i class="fas fa-circle"></i> CANLI';
                kapaliEkran.style.display = 'none';
                aktifAlan.style.display = 'flex';
                if (db) sohbetiBaslat();
            } else {
                badge.className = 'durum-badge kapali';
                badge.innerHTML = '<i class="fas fa-lock"></i> KAPALI';
                kapaliEkran.style.display = 'flex';
                aktifAlan.style.display = 'none';
                if (mesajDinleme) {
                    mesajDinleme();
                    mesajDinleme = null;
                }
            }
        }

        // ============================================
        // SOHBET BAŞLAT
        // ============================================
        function sohbetiBaslat() {
            if (!sohbetAktif || !db) return;

            const mesajlarDiv = document.getElementById('chatMessages');
            const isimInput = document.getElementById('chatUsername');
            const mesajInput = document.getElementById('chatInput');
            const gonderBtn = document.getElementById('chatSendBtn');
            const kullaniciSayisiSpan = document.getElementById('kullanici-sayisi');

            kullaniciAdi = localStorage.getItem('sohbet-kullanici') || '';
            isimInput.value = kullaniciAdi;

            function autoResize(textarea) {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
            }

            mesajInput.addEventListener('input', function() {
                autoResize(this);
            });

            isimInput.addEventListener('change', function() {
                const yeniAd = this.value.trim();
                kullaniciAdi = yeniAd;
                if (yeniAd) {
                    localStorage.setItem('sohbet-kullanici', yeniAd);
                } else {
                    localStorage.removeItem('sohbet-kullanici');
                }
            });

            if (mesajDinleme) {
                mesajDinleme();
                mesajDinleme = null;
            }

            const mesajlarQuery = db.collection(KOLEKSIYON_ADI).orderBy('zaman', 'asc');

            mesajDinleme = mesajlarQuery.onSnapshot((snapshot) => {
                const kullanicilar = new Set();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.kullanici) kullanicilar.add(data.kullanici);
                });
                kullaniciSayisiSpan.textContent = kullanicilar.size;

                mesajlarDiv.innerHTML = '';
                if (snapshot.empty) {
                    mesajlarDiv.innerHTML = `
                        <div class="bos-mesaj">
                            <i class="fas fa-comment"></i>
                            <div>💬 Henüz mesaj yok.</div>
                            <div style="font-size:0.75rem; margin-top:4px; color:#b0c0d0;">İlk yorumu sen yap!</div>
                        </div>
                    `;
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const isBen = data.kullanici === kullaniciAdi && kullaniciAdi !== '';
                    const mesajElemani = document.createElement('div');
                    mesajElemani.className = `chat-message ${isBen ? 'sent' : 'received'}`;
                    mesajElemani.dataset.msgId = doc.id;

                    const usernameSpan = document.createElement('div');
                    usernameSpan.className = 'username';
                    usernameSpan.innerHTML = `<i class="fas fa-user-circle"></i> ${escapeHtml(data.kullanici || 'Anonim')}`;

                    const metinSpan = document.createElement('div');
                    metinSpan.className = 'mesaj-metni';
                    metinSpan.textContent = data.metin;

                    const zamanSpan = document.createElement('div');
                    zamanSpan.className = 'time';
                    if (data.zaman) {
                        const d = data.zaman.toDate ? data.zaman.toDate() : new Date(data.zaman);
                        zamanSpan.textContent = d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                    }

                    mesajElemani.appendChild(usernameSpan);
                    mesajElemani.appendChild(metinSpan);
                    mesajElemani.appendChild(zamanSpan);
                    mesajlarDiv.appendChild(mesajElemani);

                    if (adminAcik) {
                        mesajElemani.style.cursor = 'pointer';
                        mesajElemani.addEventListener('click', mesajTikla);
                    }
                });

                mesajlarDiv.scrollTop = mesajlarDiv.scrollHeight;

                if (seciliMesajlar.size > 0) {
                    document.querySelectorAll('.chat-message').forEach(msg => {
                        if (seciliMesajlar.has(msg.dataset.msgId)) {
                            msg.classList.add('secilmis');
                        }
                    });
                }
            }, (error) => {
                console.error('Mesaj dinleme hatası:', error);
            });

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            async function mesajGonder() {
                if (!sohbetAktif) {
                    alert('Sohbet şu anda kapalı!');
                    return;
                }
                const metin = mesajInput.value.trim();
                if (!metin) {
                    mesajInput.focus();
                    return;
                }

                const isim = isimInput.value.trim() || 'Anonim';
                if (isimInput.value.trim()) {
                    kullaniciAdi = isim;
                    localStorage.setItem('sohbet-kullanici', isim);
                }

                try {
                    await db.collection(KOLEKSIYON_ADI).add({
                        kullanici: isim,
                        metin: metin,
                        zaman: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    console.log('✅ Mesaj gönderildi');
                    mesajInput.value = '';
                    mesajInput.style.height = 'auto';
                    mesajInput.focus();
                } catch (error) {
                    console.error('❌ Mesaj gönderme hatası:', error);
                    alert('⚠️ Mesaj gönderilemedi!');
                }
            }

            gonderBtn.removeEventListener('click', mesajGonder);
            gonderBtn.addEventListener('click', mesajGonder);

            mesajInput.removeEventListener('keydown', handleEnter);
            mesajInput.addEventListener('keydown', handleEnter);

            function handleEnter(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    mesajGonder();
                }
            }

            console.log('💬 Sohbet başlatıldı.');
        }

        // ============================================
        // ADMIN PANELİ
        // ============================================
        document.getElementById('adminAcBtn').addEventListener('click', function() {
            if (!adminAcik) {
                const sifre = prompt('Admin panelini açmak için şifre girin:');
                if (sifre === ADMIN_PASSWORD) {
                    adminAcik = true;
                    document.getElementById('adminPanel').classList.add('show');
                    this.classList.add('acik');
                    this.innerHTML = '<i class="fas fa-cog"></i>';
                    if (sohbetAktif) {
                        document.querySelectorAll('.chat-message').forEach(msg => {
                            msg.style.cursor = 'pointer';
                            msg.addEventListener('click', mesajTikla);
                        });
                    }
                } else if (sifre !== null) {
                    alert('❌ Hatalı şifre!');
                }
            } else {
                adminAcik = false;
                document.getElementById('adminPanel').classList.remove('show');
                this.classList.remove('acik');
                this.innerHTML = '<i class="fas fa-cog"></i>';
                seciliMesajlar.clear();
                document.querySelectorAll('.chat-message.secilmis').forEach(el => {
                    el.classList.remove('secilmis');
                });
                document.querySelectorAll('.chat-message').forEach(msg => {
                    msg.style.cursor = 'default';
                    msg.removeEventListener('click', mesajTikla);
                });
            }
        });

        // ===== SOHBET AÇ =====
        document.getElementById('sohbetAcBtn').addEventListener('click', function() {
            if (!adminAcik) return;
            const sifre = prompt('Sohbeti açmak için şifre girin:');
            if (sifre === ADMIN_PASSWORD) {
                sohbetDurumuGuncelle(true);
                alert('✅ Sohbet açıldı!');
            } else if (sifre !== null) {
                alert('❌ Hatalı şifre!');
            }
        });

        // ===== SOHBET KAPAT =====
        document.getElementById('sohbetKapatBtn').addEventListener('click', function() {
            if (!adminAcik) return;
            const sifre = prompt('Sohbeti kapatmak için şifre girin:');
            if (sifre === ADMIN_PASSWORD) {
                sohbetDurumuGuncelle(false);
                alert('✅ Sohbet kapatıldı!');
            } else if (sifre !== null) {
                alert('❌ Hatalı şifre!');
            }
        });

        // ============================================
        // MESAJ SEÇME / SİLME
        // ============================================
        function mesajTikla(e) {
            const msg = e.currentTarget;
            const msgId = msg.dataset.msgId;
            if (!msgId) return;

            if (seciliMesajlar.has(msgId)) {
                seciliMesajlar.delete(msgId);
                msg.classList.remove('secilmis');
            } else {
                seciliMesajlar.add(msgId);
                msg.classList.add('secilmis');
            }
        }

        document.getElementById('secTumunuBtn').addEventListener('click', function() {
            if (!adminAcik) return;
            const mesajlar = document.querySelectorAll('.chat-message');
            mesajlar.forEach(msg => {
                const msgId = msg.dataset.msgId;
                if (msgId) {
                    seciliMesajlar.add(msgId);
                    msg.classList.add('secilmis');
                }
            });
        });

        document.getElementById('silSecilenBtn').addEventListener('click', function() {
            if (!adminAcik) return;
            if (seciliMesajlar.size === 0) {
                alert('Hiç mesaj seçilmedi!');
                return;
            }

            if (confirm(`${seciliMesajlar.size} mesaj silinecek. Emin misiniz?`)) {
                const batch = db.batch();
                let silinecek = 0;
                seciliMesajlar.forEach(msgId => {
                    const docRef = db.collection(KOLEKSIYON_ADI).doc(msgId);
                    batch.delete(docRef);
                    silinecek++;
                });

                batch.commit().then(() => {
                    seciliMesajlar.clear();
                    alert(`✅ ${silinecek} mesaj silindi!`);
                }).catch((error) => {
                    console.error('Silme hatası:', error);
                    alert('❌ Silme başarısız!');
                });
            }
        });

        document.getElementById('temizleBtn').addEventListener('click', function() {
            if (!adminAcik) return;
            if (confirm('TÜM mesajlar silinecek. Emin misiniz?')) {
                db.collection(KOLEKSIYON_ADI).get().then((snapshot) => {
                    const batch = db.batch();
                    snapshot.forEach((doc) => {
                        batch.delete(doc.ref);
                    });
                    return batch.commit();
                }).then(() => {
                    alert('✅ Tüm mesajlar silindi!');
                    seciliMesajlar.clear();
                }).catch((error) => {
                    console.error('Temizleme hatası:', error);
                    alert('❌ Temizleme başarısız!');
                });
            }
        });

        // ============================================
        // BAŞLAT - VARSAYILAN KAPALI
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📱 Sayfa yüklendi, Firebase başlatılıyor...');
            sohbetDurumuGuncelle(false); // Varsayılan KAPALI
            firebaseBaslat();
        });
    </script>

</body>
</html>
