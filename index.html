<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOM RADYO - CANLI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0a101e; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { width: 100%; max-width: 450px; background: #161e2e; border-radius: 20px; overflow: hidden; border: 1px solid #2d3748; text-align: center; }
        .header { padding: 20px; background: #1c2536; color: #7aa2f7; font-size: 24px; font-weight: bold; }
        .player { padding: 40px 20px; }
        .btn { background: #25345a; border: 2px solid #3b4261; color: white; width: 80px; height: 80px; border-radius: 50%; font-size: 30px; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.1); border-color: #7aa2f7; }
        #status { margin-top: 20px; font-size: 14px; color: #8da3d0; }
        .chat-area { height: 400px; background: #000; }
        .vol-row { padding: 0 40px; margin-top: 20px; display: flex; align-items: center; gap: 10px; }
        input[type=range] { flex: 1; accent-color: #7aa2f7; }
    </style>
</head>
<body>

<div class="box">
    <div class="header">VOM RADYO</div>
    
    <div class="player">
        <button class="btn" id="pBtn" onclick="tgl()"><i class="fas fa-play" id="icon"></i></button>
        <div class="vol-row">
            <i class="fas fa-volume-down"></i>
            <input type="range" id="vol" min="0" max="1" step="0.1" value="0.8" oninput="sv(this.value)">
            <i class="fas fa-volume-up"></i>
        </div>
        <div id="status">Hazir. Oynata basin.</div>
    </div>

    <div class="chat-area">
        <script id="cid0020000392375834863" data-cfasync="false" async src="https://st.chatango.com/js/gz/emb.js" style="width: 100%;height: 100%;">
        {"handle":"vomradyo","arch":"js","styles":{"a":"161e2e","b":100,"c":"FFFFFF","d":"FFFFFF","k":"1c2536","l":"1c2536","m":"1c2536","n":"FFFFFF","p":"10","q":"1c2536","r":100}}
        </script>
    </div>
</div>

<script>
    var sUrl = "https://ws.stream-ssl.com/http://uk4freenew.listen2myradio.com:20895/;";
    var a = new Audio();
    var p = false;

    function tgl() {
        var st = document.getElementById('status');
        var ic = document.getElementById('icon');
        if (!p) {
            st.innerHTML = "Baglaniyor...";
            a.src = sUrl + "?t=" + new Date().getTime();
            a.play().then(function() {
                p = true;
                ic.className = "fas fa-pause";
                st.innerHTML = "YAYINDA";
            }).catch(function() {
                st.innerHTML = "Yayin kapali!";
            });
        } else {
            a.pause();
            a.src = "";
            p = false;
            ic.className = "fas fa-play";
            st.innerHTML = "Durduruldu.";
        }
    }
    function sv(v) { a.volume = v; }
</script>

</body>
</html>
