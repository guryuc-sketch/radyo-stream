<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOM RADYO | LIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #0d1117; color: #fff; font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; }
        .main-container { width: 100%; max-width: 500px; height: 100vh; margin: 0 auto; display: flex; flex-direction: column; background: #161b22; }
        
        /* Radyo Player Bolumu */
        .radyo-top { background: #0d1117; padding: 20px; text-align: center; border-bottom: 2px solid #30363d; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .brand-name { color: #58a6ff; font-size: 26px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 5px; }
        .live-pulse { color: #f85149; font-size: 11px; font-weight: bold; margin-bottom: 15px; display: block; animation: pulsate 1.2s infinite; }
        @keyframes pulsate { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        .p-btn { width: 75px; height: 75px; border-radius: 50%; border: none; background: #58a6ff; color: #0d1117; font-size: 30px; cursor: pointer; transition: transform 0.2s; box-shadow: 0 0 20px rgba(88, 166, 255, 0.3); }
        .p-btn:active { transform: scale(0.9); }
        
        #status-txt { margin-top: 15px; font-size: 14px; color: #8b949e; font-weight: 600; min-height: 20px; }
        .vol-box { display: flex; align-items: center; justify-content: center; gap: 15px; padding: 15px 40px; }
        .vol-box input { flex: 1; height: 4px; accent-color: #58a6ff; cursor: pointer; }

        /* Sohbet Bolumu */
        .chat-frame { flex: 1; background: #000; border-top: 1px solid #30363d; overflow: hidden; position: relative; }
        .chat-banner { background: #21262d; padding: 8px 15px; font-size: 13px; color: #58a6ff; font-weight: 700; border-bottom: 1px solid #30363d; }
    </style>
</head>
<body>

<div class="main-container">
    <!-- Player Alanı -->
    <div class="radyo-top">
        <div class="brand-name">VOM RADYO</div>
        <span class="live-pulse">● CANLI YAYIN AKIŞI</span>
        
        <button class="p-btn" onclick="startRadyo()">
            <i class="fas fa-play" id="btnIco" style="margin-left: 5px;"></i>
        </button>

        <div class="vol-box">
            <i class="fas fa-volume-down" style="font-size:12px; color:#484f58"></i>
            <input type="range" min="0" max="1" step="0.05" value="0.8" oninput="ajst(this.value)">
            <i class="fas fa-volume-up" style="font-size:12px; color:#58a6ff"></i>
        </div>
        
        <div id="status-txt">Yayını dinlemek için PLAY butonuna bas</div>
    </div>

    <!-- Sohbet Kutusu -->
    <div class="chat-banner"><i class="fas fa-comments"></i> CANLI SOHBET (Mesaj Yaz Gönder)</div>
    <div class="chat-frame">
        <script id="cid0020000392375834863" data-cfasync="false" async src="https://st.chatango.com/js/gz/emb.js" style="width: 100%; height: 100%;">
        {"handle":"vomradyo","arch":"js","styles":{"a":"161b22","b":100,"c":"FFFFFF","d":"FFFFFF","k":"21262d","l":"21262d","m":"21262d","n":"FFFFFF","p":"10","q":"21262d","r":100,"fpos":"st","ss":0,"pbc":"58a6ff"}}
        </script>
    </div>
</div>

<script>
    /* 
       Senin Cloudflare Worker Linkin. 
       Eğer çalışmazsa linki bir kez tarayıcıda tek başına açıp 'Tamam' de.
    */
    const WORKER_LINK = "https://spring-river-abed.guryuc.workers.dev/";
    
    let radyoSes = new Audio();
    let playingNow = false;

    function startRadyo() {
        const ico = document.getElementById('btnIco');
        const st = document.getElementById('status-txt');

        if (!playingNow) {
            st.innerHTML = "<i class='fas fa-spinner fa-spin'></i> BAĞLANILIYOR...";
            // Bağlantıyı temizleyip başlat
            radyoSes.src = WORKER_LINK + "?v=" + Date.now();
            
            radyoSes.play().then(() => {
                playingNow = true;
                ico.className = "fas fa-pause";
                ico.style.marginLeft = "0px";
                st.innerHTML = "<span style='color:#58a6ff;'>● RADYO ÇALIYOR</span>";
            }).catch(e => {
                console.error(e);
                st.innerHTML = "<span style='color:#f85149;'>❌ HATA: YAYIN ALINAMADI</span>";
                playingNow = false;
            });
        } else {
            radyoSes.pause();
            radyoSes.src = ""; // Streami kes
            playingNow = false;
            ico.className = "fas fa-play";
            ico.style.marginLeft = "5px";
            st.innerHTML = "Durduruldu.";
        }
    }

    function ajst(val) { radyoSes.volume = val; }
</script>

</body>
</html>
