<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOM RADYO - LIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0a101e; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { width: 100%; max-width: 450px; background: #161e2e; border-radius: 20px; overflow: hidden; border: 1px solid #2d3748; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .header { padding: 20px; background: #1c2536; color: #7aa2f7; font-size: 24px; font-weight: bold; border-bottom: 1px solid #2d3748; letter-spacing: 2px; }
        .player { padding: 35px 20px; }
        .btn { background: linear-gradient(135deg, #25345a, #1a2333); border: 2px solid #3b4261; color: white; width: 85px; height: 85px; border-radius: 50%; font-size: 35px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
        .btn:hover { transform: scale(1.1); border-color: #7aa2f7; box-shadow: 0 0 15px rgba(122, 162, 247, 0.4); }
        #status { margin-top: 20px; font-size: 14px; color: #8da3d0; font-weight: bold; }
        .chat-area { height: 350px; background: #000; border-top: 1px solid #2d3748; }
        .vol-row { padding: 0 40px; margin-top: 20px; display: flex; align-items: center; gap: 15px; }
        input[type=range] { flex: 1; accent-color: #7aa2f7; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <div class="header">VOM RADYO</div>
    
    <div class="player">
        <button class="btn" id="pBtn" onclick="tgl()">
            <i class="fas fa-play" id="icon" style="margin-left: 5px;"></i>
        </button>
        
        <div class="vol-row">
            <i class="fas fa-volume-down" style="color: #4a5568;"></i>
            <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8" oninput="sv(this.value)">
            <i class="fas fa-volume-up" style="color: #8da3d0;"></i>
        </div>
        
        <div id="status"><i class="fas fa-info-circle"></i> SİNYAL BEKLENİYOR...</div>
    </div>

    <div class="chat-area">
        <!-- Chatango Sohbet Box -->
        <script id="cid0020000392375834863" data-cfasync="false" async src="https://st.chatango.com/js/gz/emb.js" style="width: 100%;height: 100%;">
        {"handle":"vomradyo","arch":"js","styles":{"a":"161e2e","b":100,"c":"FFFFFF","d":"FFFFFF","k":"1c2536","l":"1c2536","m":"1c2536","n":"FFFFFF","p":"10","q":"1c2536","r":100}}
        </script>
    </div>
</div>

<script>
    // Dinamik Link: Listen2MyRadio Shoutcast altyapısı için zorunlu HTTPS Köprüsü
    // Eğer bağlantı kurulamazsa alternatif köprüye geçer
    var mainUrl = "https://ws.stream-ssl.com/http://109.169.23.84:20895/;";
    
    var a = new Audio();
    var p = false;
    var st = document.getElementById('status');
    var ic = document.getElementById('icon');

    function tgl() {
        if (!p) {
            st.innerHTML = "<i class='fas fa-spinner fa-spin'></i> BAĞLANILIYOR...";
            
            // Taze bir stream isteği gönderiyoruz
            a.src = mainUrl + "?t=" + new Date().getTime();
            
            a.play().then(function() {
                p = true;
                ic.className = "fas fa-pause";
                ic.style.marginLeft = "0";
                st.innerHTML = "<span style='color: #ff4d4d;'>● CANLI YAYIN AKIYOR</span>";
            }).catch(function(e) {
                st.innerHTML = "Hata: Yayın Çevrimdışı (Server Down)";
                console.error("Yayin Hatasi:", e);
            });
        } else {
            a.pause();
            a.src = "";
            p = false;
            ic.className = "fas fa-play";
            ic.style.marginLeft = "5px";
            st.innerHTML = "DURDURULDU.";
        }
    }

    function sv(v) { a.volume = v; }

    // Otomatik Durma Hatası Yakalama
    a.onerror = function() {
        if (p) {
            st.innerHTML = "Bağlantı koptu. Tekrar deneniyor...";
            tgl(); 
        }
    };
</script>

</body>
</html>
