<!DOCTYPE html>
<html lang="tr">
<head>

        .live { color:#f85149; font-size:12px; font-weight:bold; display:block; margin-bottom:20px; animation:blink 1.2s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .btn { width:85px; height:85px; border-radius:50%; border:none; background:#58a6ff; color:#0d1117; font-size:32px; cursor:pointer; transition:0.2s; box-shadow:0 0 25px rgba(88,166,255,0.3); display:inline-flex; align-items:center; justify-content:center; }

<body>
<div class="app">
    <div class="header">VOM RADYO</div>

        <span class="live">● CANLI YAYIN</span>
        <button class="btn" onclick="tgl()">
            <i class="fas fa-play" id="ico" style="margin-left:5px"></i>
        </button>
        <div class="vol">
            <i class="fas fa-volume-down" style="color:#484f58;font-size:12px"></i>
            <input type="range" min="0" max="1" step="0.05" value="0.8" id="vol">

        </script>
    </div>
</div>

<script>
   var STREAM = "https://source:sirZxQuLvs@sapircast.caster.fm:18951/xskUh";
    var a = null;
    var pl = false;

    document.getElementById('vol').addEventListener('input', function() {
        if (a) a.volume = this.value;
    });

    function tgl() {
        var ico = document.getElementById('ico');
        var st = document.getElementById('st');

        if (!pl) {
            st.innerHTML = "Bağlanıyor...";
            st.style.color = "#8b949e";

            if (a) { a.pause(); a.src = ""; }
            
            a = new Audio(STREAM + "?t=" + Date.now());
            a.volume = document.getElementById('vol').value;

            a.addEventListener('playing', function() {
                pl = true;
                ico.className = "fas fa-pause";
                ico.style.marginLeft = "0";
                st.innerHTML = "🔴 YAYIN AKIYOR";
                st.style.color = "#58a6ff";
            });

            a.addEventListener('error', function() {
                pl = false;
                ico.className = "fas fa-play";
                ico.style.marginLeft = "5px";
                st.innerHTML = "❌ Yayin kapali";
                st.style.color = "#f85149";
            });

            a.play().catch(function() {
                st.innerHTML = "⚠️ Tekrar Play'e bas";
                pl = false;
            });

        } else {
            a.pause();
            a.src = "";
            pl = false;
            ico.className = "fas fa-play";
            ico.style.marginLeft = "5px";
            st.innerHTML = "Durduruldu.";
            st.style.color = "#8b949e";
        }
    }
</script>
