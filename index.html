<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOM RADYO | Canlı Yayın</title>
    <!-- İkonlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0a0f1e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #111927;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #1f2937;
            border-right: 1px solid #1f2937;
        }
        /* Header Bölümü */
        .header {
            padding: 15px;
            text-align: center;
            background: #1a2333;
            border-bottom: 1px solid #2d3748;
        }
        .header h1 {
            color: #7aa2f7;
            font-size: 22px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        /* Player Alanı */
        .player-box {
            padding: 20px;
            background: #111927;
            text-align: center;
            border-bottom: 1px solid #1f2937;
        }
        .live-indicator {
            color: #ff4d4d;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
            display: block;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        .play-btn {
            background: #7aa2f7;
            color: #0a0f1e;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(122, 162, 247, 0.4);
        }
        .play-btn:active { transform: scale(0.9); }
        
        .volume-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 250px;
            margin: 0 auto;
        }
        .volume-bar input {
            flex: 1;
            height: 4px;
            accent-color: #7aa2f7;
            cursor: pointer;
        }
        #status-msg {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 12px;
        }

        /* CHAT ALANI (Kayıtsız Sohbet) */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000000;
            position: relative;
        }
        .chat-label {
            background: #1a2333;
            padding: 8px 15px;
            font-size: 13px;
            font-weight: 600;
            color: #7aa2f7;
            border-bottom: 1px solid #2d3748;
        }
        #chat-embed-box {
            flex: 1;
            width: 100%;
        }

        /* Alt İletişim */
        .footer-social {
            padding: 10px;
            background: #1a2333;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #2d3748;
        }
        .social-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .social-link i { font-size: 18px; }
        .social-link.wa { color: #25d366; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>VOM RADYO</h1>
    </div>

    <div class="player-box">
        <span class="live-indicator"><i class="fas fa-circle"></i> CANLI YAYIN</span>
        
        <div class="controls">
            <button class="play-btn" id="mBtn" onclick="toggleStream()">
                <i class="fas fa-play" id="mIcon" style="margin-left: 5px;"></i>
            </button>
        </div>

        <div class="volume-bar">
            <i class="fas fa-volume-off" style="font-size: 12px; color: #4b5563;"></i>
            <input type="range" min="0" max="1" step="0.05" value="0.8" oninput="changeVol(this.value)">
            <i class="fas fa-volume-up" style="font-size: 12px; color: #7aa2f7;"></i>
        </div>

        <div id="status-msg">Dinlemek için oynat butonuna basın</div>
    </div>

    <div class="chat-label">
        <i class="fas fa-comments"></i> CANLI SOHBET (Kayıt Gerekmez)
    </div>

    <!-- SOHBET ALANI: Herkese açık ve WhatsApp tarzı kayıt istemeyen yapı -->
    <div class="chat-section">
        <div id="chat-embed-box">
            <!-- Chatango kutusu anonim girişlere izin verecek şekilde yapılandırıldı -->
            <script id="cid0020000392375834863" data-cfasync="false" async src="https://st.chatango.com/js/gz/emb.js" style="width: 100%; height: 100%;">
            {"handle":"vomradyo","arch":"js","styles":{"a":"111927","b":100,"c":"FFFFFF","d":"FFFFFF","k":"1a2333","l":"1a2333","m":"1a2333","n":"FFFFFF","p":"10","q":"1a2333","r":100,"fpos":"st","ss":0,"pbc":"7aa2f7"}}
            </script>
        </div>
    </div>

    <div class="footer-social">
        <a href="https://wa.me/901234567890" target="_blank" class="social-link wa">
            <i class="fab fa-whatsapp"></i> Mesaj Gönder
        </a>
        <a href="mailto:iletisim@vomradyo.com" class="social-link">
            <i class="fas fa-envelope"></i> E-Posta
        </a>
    </div>
</div>

<script>
    /*
        HTTPS BULUT KOPRUSU: 
        Senin olusturdugun Cloudflare Worker linkini kullaniyoruz. 
        Bu sayede iPhone ve Android guvenlik engelini aşar.
    */
    const WORKER_URL = "https://spring-river-abed.guryuc.workers.dev/";
    
    let audio = new Audio();
    let playing = false;

    const btnIcon = document.getElementById('mIcon');
    const statusTxt = document.getElementById('status-msg');

    function toggleStream() {
        if (!playing) {
            statusTxt.innerHTML = "<i class='fas fa-spinner fa-spin'></i> BAĞLANILIYOR...";
            
            // Taze baglanti icin t= degeri eklenmistir
            audio.src = WORKER_URL + "?t=" + new Date().getTime();
            
            audio.play().then(function() {
                playing = true;
                btnIcon.className = "fas fa-pause";
                btnIcon.style.marginLeft = "0px";
                statusTxt.innerHTML = "<span style='color:#7aa2f7; font-weight:bold;'>YAYIN AKIYOR...</span>";
            }).catch(function(e) {
                console.error("Yayin Hatasi:", e);
                statusTxt.innerHTML = "<span style='color:#ff4d4d;'>YAYIN ŞU AN ÇEVRİMDIŞI</span>";
            });
        } else {
            audio.pause();
            audio.src = ""; // Baglantiyi tamamen durdurur
            playing = false;
            btnIcon.className = "fas fa-play";
            btnIcon.style.marginLeft = "5px";
            statusTxt.innerHTML = "Yayın durduruldu.";
        }
    }

    function changeVol(v) {
        audio.volume = v;
    }

    // Mobil cihazlar uyku moduna gecerse baglantiyi tazelemek icin
    document.addEventListener("visibilitychange", function() {
        if (!document.hidden && playing) {
            // Yayın devam ediyorsa bir sey yapma
        }
    });
</script>

</body>
</html>
