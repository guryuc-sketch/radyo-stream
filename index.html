<head>

    <style>
        body { background:#0a0f1e; color:white; font-family:sans-serif; text-align:center; padding:20px; }
        .box { max-width:400px; margin:auto; background:#111927; padding:30px; border-radius:20px; border:1px solid #1f2937; }
        .play-btn { width:80px; height:80px; border-radius:50%; border:none; background:#7aa2f7; font-size:30px; cursor:pointer; }
        #st { margin-top:15px; color:#94a3b8; font-size:14px; }
        .chat-box { margin-top:20px; height:350px; background:#000; }
    </style>
</head>
<body>
    <div class="box">
        <h2>VOM RADYO</h2>
        <br>
        <button class="play-btn" onclick="playRad()" id="b"><i class="fas fa-play" id="i"></i></button>
        <div id="st">Yayını başlatmak için bas</div>
    </div>

    <div class="chat-box">

        </script>
    </div>

    <script>
        var sUrl = "https://spring-river-abed.guryuc.workers.dev/"; 
        var a = new Audio();
        var isP = false;

        function playRad() {
            var st = document.getElementById('st');
            var i = document.getElementById('i');
            if (!isP) {
                st.innerHTML = "Sinyal Çekiliyor...";
                a.src = sUrl + "?cb=" + Math.random();
                a.play().then(function() {
                    isP = true; i.className = "fas fa-pause"; st.innerHTML = "CANLI YAYINDA";
                }).catch(function() {
                    st.innerHTML = "Hata: Sunucu bağlanmayı reddetti.";
                });
            } else {
                a.pause(); a.src = ""; isP = false; i.className = "fas fa-play"; st.innerHTML = "Durduruldu.";
            }
        }
    </script>
</body>
</html>
