<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOM RADYO - Canli Yayin</title>
    <!-- Ikonlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a101e; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .box { width: 100%; max-width: 480px; background: #161e2e; border-radius: 20px; overflow: hidden; border: 1px solid #2d3748; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        .header { padding: 25px; background: #1c2536; color: #7aa2f7; text-align: center; font-size: 24px; font-weight: bold; border-bottom: 1px solid #2d3748; letter-spacing: 3px; }
        .player { padding: 35px 20px; text-align: center; }
        .live { color: #ff4d4d; font-weight: bold; margin-bottom: 20px; font-size: 14px; letter-spacing: 1px; display: block; }
        .btn { background: linear-gradient(135deg, #25345a, #1a2333); border: 1px solid #3b4261; color: #fff; width: 85px; height: 85px; border-radius: 50%; font-size: 32px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .btn:hover { transform: scale(1.1); border-color: #7aa2f7; }
        #status { margin-top: 20px; font-size: 13px; color: #8da3d0; font-weight: 500; height: 20px; }
        .chat-area { height: 400px; background: #000; border-top: 1px solid #2d3748; }
        .vol-row { padding: 0 40px; margin-top: 25px; display: flex; align-items: center; gap: 15px; }
        input[type=range] { flex: 1; accent-color: #7aa2f7; height: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <div class="header">VOM RADYO</div>
    
    <div class="player">
        <span class="live" id="liveTxt"><i class="fas fa-circle"></i> CANLI YAYIN</span>
        
        <button class="btn" id="play" onclick="handleStream()">
            <i class="fas fa-play" id="icon" style="margin-left: 5px;"></i>
        </button>
        
        <div class="vol-row">
            <i class="fas fa-volume-down" style="color: #4a5568;"></i>
            <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8" oninput="changeV(this.value)">
            <i class="fas fa-volume-up" style="color: #8da3d0;"></i>
        </div>
        
        <div id="status">HAZIR. DINLEMEK ICIN PLAY'E BASIN.</div>
    </div>

    <!-- Sohbet Bolumu (Chatango) -->
    <div class="chat-area">
        <script id="cid0020000392375834863" data-cfasync="false" async src="https://st.chatango.com/js/gz/emb.js" style="width: 100%;height: 100%;">
        {"handle":"vomradyo","arch":"js","styles":{"a":"161e2e","b":100,"c":"FFFFFF","d":"FFFFFF","k":"1c2536","l":"1c2536","m":"1c2536","n":"FFFFFF","p":"10","q":"1c2536","r":100}}
        </script>
    </div>
</div>

<script>
    /*
      SSL KOPRUSU ACILDI: 
      Apple (iPhone) ve Android tarayicilar HTTP linkini ancak bu kopru ile calistirir.
      Sonuna ';' ekledik, Shoutcast v1 sunucularda bu isaret tarayiciya "SADECE SES VER" der.
    */
    const sUrl = "https://ws.stream-ssl.com/http://109.169.23.84:20895/;";
    
    let audio = new Audio();
    let playing = false;

    function handleStream() {
        const btn = document.getElementById('play');
        const icon = document.getElementById('icon');
        const status = document.getElementById('status');

        if (!playing) {
            status.innerHTML = "BAGLANIYOR...";
            // Taze bir stream icin sonuna zaman ekliyoruz
            audio.src = sUrl + "?t=" + new Date().getTime();
            
            audio.play().then(function() {
                playing = true;
                icon.className = "fas fa-pause";
                icon.style.marginLeft = "0px";
                status.innerHTML = "<span style='color:#7aa2f7'>CANLI YAYIN DİNLENİYOR</span>";
            }).catch(function(e) {
                console.error("Yayin Hatasi:", e);
                status.innerHTML = "❌ Hata: Yayin su an cevrimdisi.";
            });
        } else {
            audio.pause();
            audio.src = ""; // Baglantiyi tamamen kes
            playing = false;
            icon.className = "fas fa-play";
            icon.style.marginLeft = "5px";
            status.innerHTML = "DURDURULDU.";
        }
    }

    function changeV(val) { audio.volume = val; }

    // Canli tag yanip sönme
    setInterval(function() {
        const live = document.getElementById('liveTxt');
        live.style.opacity = (live.style.opacity === '0' ? '1' : '0');
    }, 1000);
</script>

</body>
</html>
