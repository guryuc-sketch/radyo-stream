<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOM RADYO | LIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b0e14; color: white; font-family: -apple-system, system-ui, sans-serif; height: 100vh; overflow: hidden; }
        .main { width: 100%; max-width: 500px; height: 100vh; margin: 0 auto; display: flex; flex-direction: column; background: #151b23; border-left: 1px solid #30363d; border-right: 1px solid #30363d; }
        
        .p-box { background: #161b22; padding: 25px 20px; text-align: center; border-bottom: 2px solid #000; }
        .tit { color: #58a6ff; font-size: 26px; font-weight: 900; letter-spacing: 5px; margin-bottom: 8px; }
        .live { color: #f85149; font-size: 11px; font-weight: bold; animation: blnk 1.2s infinite; display: block; margin-bottom: 20px; }
        @keyframes blnk { 0% {opacity:1} 50% {opacity:0.3} 100% {opacity:1} }
        
        .p-btn { width: 85px; height: 85px; border-radius: 50%; border: none; background: #58a6ff; color: #0d1117; font-size: 34px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 25px rgba(88, 166, 255, 0.2); }
        .p-btn:active { transform: scale(0.9); }
        
        #st { margin-top: 15px; font-size: 13px; color: #8b949e; font-weight: bold; min-height: 20px; }
        .v-row { display: flex; align-items: center; justify-content: center; gap: 15px; padding: 15px 50px; }
        .v-row input { flex: 1; accent-color: #58a6ff; height: 4px; }

        .chat-wrap { flex: 1; background: #000; border-top: 1px solid #30363d; display: flex; flex-direction: column; }
        .chat-h { background: #21262d; padding: 10px; font-size: 12px; color: #58a6ff; font-weight: bold; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; }
        
        .refresh-link { color: #8b949e; font-size: 10px; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div class="main">
    <div class="p-box">
        <div class="tit">VOM RADYO</div>
        <span class="live">● CANLI YAYIN</span>
        
        <button class="p-btn" onclick="tglR()">
            <i class="fas fa-play" id="pIco" style="margin-left: 5px;"></i>
        </button>

        <div class="v-row">
            <i class="fas fa-volume-down" style="color:#484f58"></i>
            <input type="range" min="0" max="1" step="0.05" value="0.8" oninput="adj(this.value)">
            <i class="fas fa-volume-up" style="color:#58a6ff"></i>
        </div>
        <div id="st">Yayını Başlatmak İçin Dokun</div>
    </div>

    <div class="chat-h">
        <span><i class="fas fa-comments"></i> CANLI SOHBET</span>
        <span class="refresh-link" onclick="window.location.reload()">Sayfayı Yenile</span>
    </div>

    <div class="chat-wrap">
        <script id="cid0020000392375834863" data-cfasync="false" async src="https://st.chatango.com/js/gz/emb.js" style="width: 100%; height: 100%;">
        {"handle":"vomradyo","arch":"js","styles":{"a":"161b22","b":100,"c":"FFFFFF","d":"FFFFFF","k":"21262d","l":"21262d","m":"21262d","n":"FFFFFF","p":"10","q":"21262d","r":100,"fpos":"st","ss":0,"pbc":"58a6ff"}}
        </script>
    </div>
</div>

<script>
    // Kendi Worker Linkin
    const SRC = "https://spring-river-abed.guryuc.workers.dev/";
    
    let a = new Audio();
    let pl = false;

    function tglR() {
        const i = document.getElementById('pIco');
        const s = document.getElementById('st');

        if (!pl) {
            s.innerHTML = "<i class='fas fa-spinner fa-spin'></i> BAĞLANILIYOR...";
            // Önbelleği (cache) her seferinde bozarak temiz bağlantı açar
            a.src = SRC + "?cb=" + Math.random();
            
            a.play().then(() => {
                pl = true;
                i.className = "fas fa-pause";
                i.style.marginLeft = "0px";
                s.innerHTML = "<span style='color:#58a6ff;'>YAYIN ÇALIYOR</span>";
            }).catch(err => {
                console.error(err);
                s.innerHTML = "<span style='color:#f85149;'>SUNUCU HATASI: TEKRAR DENE</span>";
            });
        } else {
            a.pause();
            a.src = ""; 
            pl = false;
            i.className = "fas fa-play";
            i.style.marginLeft = "5px";
            s.innerHTML = "Durduruldu.";
        }
    }
    function adj(v) { a.volume = v; }
</script>

</body>
</html>
