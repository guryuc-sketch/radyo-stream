<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOM RADYO - LIVE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f1e;
            font-family: Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #121928;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #2d3748;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            padding: 20px;
            text-align: center;
            background: #1a2333;
            border-bottom: 1px solid #2d3748;
        }
        .header h1 {
            color: #7aa2f7;
            font-size: 24px;
            letter-spacing: 2px;
        }
        .player-box {
            padding: 30px 20px;
            text-align: center;
        }
        .live-tag {
            color: #ff4d4d;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
            text-transform: uppercase;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .btn {
            background: #1f2a44;
            border: 1px solid #3b4261;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover { background: #25345a; }
        .vol-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 40px;
        }
        input[type=range] {
            flex: 1;
            cursor: pointer;
        }
        #status {
            font-size: 12px;
            color: #8da3d0;
            margin-top: 15px;
        }
        /* Chat Box */
        .chat-area {
            height: 350px;
            background: #000;
            border-top: 1px solid #2d3748;
        }
    </style>
    <!-- Font Awesome (İkonlar) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>VOM RADYO</h1>
    </div>

    <div class="player-box">
        <div class="live-tag">
            <i class="fas fa-circle" id="blink" style="font-size:10px;"></i> CANLI YAYIN
        </div>

        <div class="controls">
            <button class="btn" id="play" onclick="togglePlay()"><i class="fas fa-play" id="icon"></i></button>
        </div>

        <div class="vol-row">
            <i class="fas fa-volume-down"></i>
            <input type="range" id="volume" min="0" max="1" step="0.1" value="0.8" oninput="changeVol(this.value)">
            <i class="fas fa-volume-up"></i>
        </div>

        <div id="status">Hazir. Oynata basin.</div>
    </div>

    <!-- Sohbet Bolumu -->
    <div class="chat-area">
        <!-- Chatango widget baslangic -->
        <script id="cid0020000392375834863" data-cfasync="false" async src="https://st.chatango.com/js/gz/emb.js" style="width: 100%;height: 100%;">
        {"handle":"vomradyo","arch":"js","styles":{"a":"121928","b":100,"c":"FFFFFF","d":"FFFFFF","k":"1a2333","l":"1a2333","m":"1a2333","n":"FFFFFF","p":"10","q":"1a2333","r":100,"fpos":"st","ss":0}}
        </script>
        <!-- Chatango widget bitis -->
    </div>
</div>

<script>
    // Dinamik HTTPS Tüneli
    var streamUrl = "https://ws.stream-ssl.com/http://109.169.23.84:20895/;";
    var audio = new Audio();
    var playing = false;
    var btn = document.getElementById('play');
    var icon = document.getElementById('icon');
    var statusTxt = document.getElementById('status');

    function togglePlay() {
        if (!playing) {
            statusTxt.innerHTML = "Baglaniyor...";
            audio.src = streamUrl;
            audio.play().then(function() {
                playing = true;
                icon.className = "fas fa-pause";
                statusTxt.innerHTML = "YAYINDA";
            }).catch(function(e) {
                statusTxt.innerHTML = "Hata: Sunucu kapali olabilir.";
            });
        } else {
            audio.pause();
            audio.src = ""; 
            playing = false;
            icon.className = "fas fa-play";
            statusTxt.innerHTML = "Durduruldu.";
        }
    }

    function changeVol(v) {
        audio.volume = v;
    }

    // Yanıp sönen canlı simgesi
    setInterval(function() {
        var dot = document.getElementById('blink');
        dot.style.visibility = (dot.style.visibility === 'hidden' ? 'visible' : 'hidden');
    }, 1000);
</script>

</body>
</html>
