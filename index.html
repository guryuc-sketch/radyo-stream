<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOM RADYO | LIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #0b0e14; color: #ffffff; font-family: sans-serif; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; background: #12171f; }
        
        /* Player Kısmı */
        .player-card { background: #1a222c; padding: 20px; text-align: center; border-bottom: 2px solid #000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .brand { font-size: 24px; color: #7aa2f7; font-weight: 800; letter-spacing: 2px; margin-bottom: 5px; }
        .live-label { font-size: 11px; color: #ff4d4d; animation: blink 1s infinite; margin-bottom: 15px; display: block; font-weight: bold; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .play-btn { width: 70px; height: 70px; border-radius: 50%; border: none; background: #7aa2f7; color: #12171f; font-size: 28px; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .play-btn:active { transform: scale(0.9); }
        
        #status-txt { font-size: 13px; color: #a0aec0; margin: 10px 0; font-style: italic; }
        
        .vol-box { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 40px; }
        .vol-box input { flex: 1; height: 4px; accent-color: #7aa2f7; }

        /* Sohbet Kısmı */
        .chat-wrap { flex: 1; background: #000; display: flex; flex-direction: column; }
        .chat-header { background: #1a222c; padding: 8px 15px; font-size: 12px; color: #7aa2f7; border-top: 1px solid #2d3748; }

        /* WhatsApp tarzı Alt Menü */
        .social-bar { background: #1a222c; padding: 12px; display: flex; justify-content: space-around; border-top: 1px solid #2d3748; }
        .social-btn { color: #a0aec0; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .wa-btn { color: #25d366; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="player-card">
        <div class="brand">VOM RADYO</div>
        <span class="live-label">● CANLI YAYIN</span>
        
        <button class="play-btn" id="mButton" onclick="tgl()">
            <i class="fas fa-play" id="mIcon"></i>
        </button>

        <div class="vol-box">
            <i class="fas fa-volume-down" style="font-size: 12px; color:#4a5568"></i>
            <input type="range" min="0" max="1" step="0.05" value="0.8" oninput="sv(this.value)">
            <i class="fas fa-volume-up" style="font-size: 12px; color:#7aa2f7"></i>
        </div>
        
        <div id="status-txt">Hazır • Oynat'a basın</div>
    </div>

    <div class="chat-header"><i class="fas fa-comments"></i> CANLI SOHBET (Takma Ad Yaz Geri)</div>
    
    <div class="chat-wrap">
        <!-- Kayıtsız WhatsApp Tarzı Sohbet -->
        <script id="cid0020000392375834863" data-cfasync="false" async src="https://st.chatango.com/js/gz/emb.js" style="width: 100%; height: 100%;">
        {"handle":"vomradyo","arch":"js","styles":{"a":"12171f","b":100,"c":"FFFFFF","d":"FFFFFF","k":"1a222c","l":"1a222c","m":"1a222c","n":"FFFFFF","p":"10","q":"1a222c","r":100,"fpos":"st","ss":0,"pbc":"7aa2f7"}}
        </script>
    </div>

    <div class="social-bar">
        <a href="https://wa.me/901234567890" target="_blank" class="social-btn wa-btn">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a href="#" class="social-btn">
            <i class="fas fa-share-alt"></i> Paylaş
        </a>
    </div>
</div>

<script>
    // SENİN WORKER LİNKİN
    const URL = "https://spring-river-abed.guryuc.workers.dev/";
    
    let a = new Audio();
    let isP = false;
    const btn = document.getElementById('mButton');
    const icon = document.getElementById('mIcon');
    const st = document.getElementById('status-txt');

    function tgl() {
        if (!isP) {
            st.innerHTML = "<i class='fas fa-spinner fa-spin'></i> BAĞLANILIYOR...";
            a.src = URL + "?t=" + Date.now(); // Cache kırmak için
            
            a.play().then(() => {
                isP = true;
                icon.className = "fas fa-pause";
                st.innerHTML = "<b>YAYIN AKIYOR</b>";
                st.style.color = "#7aa2f7";
            }).catch(e => {
                console.error(e);
                st.innerHTML = "❌ HATA: YAYIN ALINAMADI";
                st.style.color = "#ff4d4d";
            });
        } else {
            a.pause();
            a.src = ""; // Bağlantıyı kopar
            isP = false;
            icon.className = "fas fa-play";
            st.innerHTML = "Yayın durduruldu";
            st.style.color = "#a0aec0";
        }
    }

    function sv(v) { a.volume = v; }
</script>

</body>
</html>
